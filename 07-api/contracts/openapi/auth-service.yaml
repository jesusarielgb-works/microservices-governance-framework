openapi: 3.0.3
info:
  title: Auth Service API
  version: 1.0.0
  description: |
    Servicio de autenticación: registro, login, renovación de tokens y gestión de sesiones.

    ## Flujo de autenticación
    1. `POST /auth/register` — crear cuenta
    2. `POST /auth/login` — obtener access_token + refresh_token
    3. Usar `access_token` en el header `Authorization: Bearer` para todos los demás endpoints
    4. Cuando el access_token expire (1h): `POST /auth/refresh` con el refresh_token
    5. Para cerrar sesión: `POST /auth/logout`

    ## Tokens
    - **access_token**: JWT RS256, expira en 1 hora. Incluye userId, email, roles, permissions.
    - **refresh_token**: Opaque token (UUID), expira en 7 días. Solo válido una vez (rotación).

servers:
  - url: http://localhost:8081
    description: Local development
  - url: https://api.dev.{domain}/api/v1/auth
    description: Development
    variables:
      domain:
        default: example.com
  - url: https://api.{domain}/api/v1/auth
    description: Production
    variables:
      domain:
        default: example.com

security: []  # La mayoría de estos endpoints son públicos

tags:
  - name: Auth
    description: Registro, login y gestión de sesiones
  - name: Keys
    description: Claves públicas para verificación de tokens
  - name: Health
    description: Estado del servicio

paths:
  /health:
    get:
      summary: Health check
      tags: [Health]
      security: []
      responses:
        '200':
          description: Servicio saludable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
                  db:
                    type: string
                    enum: [connected, disconnected]
                  redis:
                    type: string
                    enum: [connected, disconnected]
              example:
                status: ok
                db: connected
                redis: connected

  /register:
    post:
      summary: Registrar un nuevo usuario
      operationId: register
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: usuario@example.com
              password: "SecurePass123!"
              name: "María García"
      responses:
        '201':
          description: Usuario registrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: El email ya está registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: EMAIL_ALREADY_EXISTS
                message: El email ya está registrado

  /login:
    post:
      summary: Autenticar un usuario
      operationId: login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: usuario@example.com
              password: "SecurePass123!"
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: INVALID_CREDENTIALS
                message: Email o contraseña incorrectos
        '423':
          description: Cuenta bloqueada temporalmente por intentos fallidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /refresh:
    post:
      summary: Renovar el access token
      operationId: refreshToken
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  description: Refresh token obtenido en login o en el último refresh
      responses:
        '200':
          description: Tokens renovados (el refresh token anterior ya no es válido)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Refresh token inválido, expirado o ya usado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /logout:
    post:
      summary: Cerrar sesión
      operationId: logout
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: Si se provee, también revoca el refresh token
                allDevices:
                  type: boolean
                  description: Si es true, revoca todos los refresh tokens del usuario
                  default: false
      responses:
        '204':
          description: Sesión cerrada exitosamente
        '401':
          $ref: '#/components/responses/Unauthorized'

  /jwks:
    get:
      summary: Claves públicas para verificación de tokens (JWKS)
      description: Endpoint estándar JWKS para que los servicios verifiquen tokens sin llamar al auth-service.
      operationId: getJwks
      tags: [Keys]
      security: []
      responses:
        '200':
          description: JSON Web Key Set
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      description: JWK (RFC 7517)

components:
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
          maxLength: 100
          description: Mínimo 8 caracteres, una mayúscula, un número
        name:
          type: string
          minLength: 1
          maxLength: 100

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      required: [accessToken, refreshToken, expiresIn, user]
      properties:
        accessToken:
          type: string
          description: JWT RS256. Incluir en Authorization Bearer para requests autenticados.
        refreshToken:
          type: string
          description: Opaque token. Usar en POST /refresh cuando el access token expire.
        expiresIn:
          type: integer
          description: Segundos hasta la expiración del access token
          example: 3600
        user:
          $ref: '#/components/schemas/UserSummary'

    UserSummary:
      type: object
      required: [id, email, roles]
      properties:
        id:
          $ref: './_shared.yaml#/components/schemas/UUID'
        email:
          type: string
          format: email
        name:
          type: string
        roles:
          type: array
          items:
            type: string
            enum: [ADMIN, USER, VIEWER]
        permissions:
          type: array
          items:
            type: string
            description: Formato "[recurso]:[accion]"
          example: ["appointment:read", "appointment:write"]

    ErrorResponse:
      $ref: './_shared.yaml#/components/schemas/ErrorResponse'

  responses:
    BadRequest:
      description: Error de validación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Token inválido o expirado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  securitySchemes:
    bearerAuth:
      $ref: './_shared.yaml#/components/securitySchemes/bearerAuth'
